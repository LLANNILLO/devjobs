<!doctype html>
<html lang="es">
    <head>
        <title>DevJobs - Empleos</title>
        <meta charset="UTF-8" />
        <meta
            name="description"
            content="Listado con empleos y filtros para encontrar el trabajo de tus sueños."
        />

        <link rel="stylesheet" href="./styles.css" />
        <script type="module" src="./main.js"></script>
    </head>

    <body>
        <header>
            <h1>
                <svg
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                DevJobs
            </h1>
            <nav>
                <a href="./index.html">Inicio</a>
                <a href="./empleos.html">Empleo</a>
            </nav>
            <div>
                <a href="">Publicar un empleo</a>
                <devjobs-avatar></devjobs-avatar>
                <!--<a href="">Iniciar sesión</a>-->
            </div>
        </header>

        <main>
            <section class="jobs-search">
                <h1>Encuentra tu próximo trabajo</h1>
                <p>Explora miles de oportunidades en el sector tecnológico.</p>

                <form id="empleos-search-form" role="search">
                    <div class="search-bar">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-search"
                        >
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path
                                d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"
                            />
                            <path d="M21 21l-6 -6" />
                        </svg>

                        <input
                            type="text"
                            name="search"
                            id="empleos-search-input"
                            placeholder="Buscar trabajos, empresas o habilidades"
                        />
                    </div>
                    <div class="search-filters">
                        <select name="technology" id="filter-technology">
                            <option value="">Tecnología</option>
                            <optgroup label="Tecnologías populares">
                                <option value="javascript">JavaScript</option>
                                <option value="python">Python</option>
                                <option value="react">React</option>
                                <option value="nodejs">Node.js</option>
                            </optgroup>
                            <option value="java">Java</option>
                            <hr />
                            <option value="csharp">C#</option>
                            <option value="c">C</option>
                            <option value="c++">C++</option>
                            <hr />
                            <option value="ruby">Ruby</option>
                            <option value="php">PHP</option>
                        </select>

                        <select name="location" id="filter-location">
                            <option value="">Ubicación</option>
                            <option value="remoto">Remoto</option>
                            <option value="cdmx">Ciudad de México</option>
                            <option value="guadalajara">Guadalajara</option>
                            <option value="monterrey">Monterrey</option>
                            <option value="barcelona">Barcelona</option>
                        </select>

                        <select name="contract-type" id="filter-contract-type">
                            <option value="">Tipo de contrato</option>
                            <option value="permanent">Indefinido</option>
                            <option value="intership">Prácticas</option>
                            <option value="fixed-term">
                                Duración determinada
                            </option>
                        </select>

                        <select
                            name="experience-level"
                            id="filter-experience-level"
                        >
                            <option value="">Nivel de Experiencia</option>
                            <option value="junior">Junior</option>
                            <option value="mid">Mid-level</option>
                            <option value="senior">Senior</option>
                            <option value="lead">Lead</option>
                        </select>
                    </div>
                </form>

                <span id="filter-selected-value"></span>
            </section>

            <section>
                <h2>Resultados de la búsqueda</h2>
                <div class="jobs-listing">
                    <devjobs-job-list class="jobs-listings"></devjobs-job-list>
                </div>
                <devjobs-pagination page="1" totalPages="5"></devjobs-pagination>
            </section>
        </main>

        <footer>
            <small>&copy; 2026 DevJobs. Todos los derechos reservados</small>
        </footer>
    </body>
</html>
