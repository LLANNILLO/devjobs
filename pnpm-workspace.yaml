packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  '@types/cors': ^2.8.19
  '@types/express': ^5.0.6
  '@types/node': ^24
  cors: ^2.8.6
  eslint-plugin-perfectionist: ^5.13.0
  express: ^5.3.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
